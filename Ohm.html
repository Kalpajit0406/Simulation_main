<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Ohm's Law Simulation</title>
    <style>
        :root {
            --primary-color: #0052cc;
            --secondary-color: #6c757d;
            --background-color: #f4f5f7;
            --surface-color: #ffffff;
            --text-color: #172b4d;
            --border-color: #dfe1e6;
            --electron-color: #ffab00;
        }

        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--background-color);
            color: var(--text-color);
        }

        .simulation-container {
            background-color: var(--surface-color);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 950px;
            max-width: 95%;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        h1 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 2.5rem;
            font-size: 2.8em;
            font-weight: 700;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 40% 60%;
            gap: 3rem;
            align-items: center;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .control-group {
            background-color: var(--background-color);
            padding: 1.5rem 2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        label {
            font-size: 1.3em;
            font-weight: 500;
            display: block;
            margin-bottom: 1rem;
            color: #42526e;
        }
        
        #voltage-value, #resistance-value {
            font-weight: 700;
            color: var(--primary-color);
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 10px;
            background: #dfe1e6;
            border-radius: 5px;
            outline: none;
            transition: background 0.3s;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 26px;
            height: 26px;
            background: var(--surface-color);
            border: 3px solid var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="range"]:hover::-webkit-slider-thumb {
            transform: scale(1.1);
            box-shadow: 0 0 0 8px rgba(0, 82, 204, 0.2);
        }

        #circuit-diagram {
            border: none;
            width: 100%;
            height: 300px;
        }

        .equation-display {
            text-align: center;
            font-size: 2em;
            margin-top: 3rem;
            padding: 1.25rem;
            background: linear-gradient(135deg, #0052cc, #0065ff);
            color: white;
            border-radius: 12px;
            font-family: "Georgia", serif;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0, 82, 204, 0.3);
        }
    </style>
</head>
<body>

<div class="simulation-container">
    <h1>Ohm's Law Interactive Simulation</h1>
    
    <div class="main-layout">
        <div class="controls">
            <div class="control-group">
                <label for="voltage-slider">Voltage (V): <span id="voltage-value">9.0</span> V</label>
                <input type="range" id="voltage-slider" min="0.1" max="20" value="9.0" step="0.1">
            </div>
            <div class="control-group">
                <label for="resistance-slider">Resistance (R): <span id="resistance-value">500</span> Ω</label>
                <input type="range" id="resistance-slider" min="10" max="1000" value="500" step="1">
            </div>
        </div>
        
        <canvas id="circuit-diagram"></canvas>
    </div>

    <div class="equation-display">
        Current (I) = <span id="current-value">0.0180</span> A
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const voltageSlider = document.getElementById('voltage-slider');
        const resistanceSlider = document.getElementById('resistance-slider');
        const voltageValueSpan = document.getElementById('voltage-value');
        const resistanceValueSpan = document.getElementById('resistance-value');
        const currentValueSpan = document.getElementById('current-value');
        const canvas = document.getElementById('circuit-diagram');
        const ctx = canvas.getContext('2d');

        const dpi = window.devicePixelRatio || 1;
        canvas.width = canvas.offsetWidth * dpi;
        canvas.height = canvas.offsetHeight * dpi;
        ctx.scale(dpi, dpi);
        
        let electrons = [];
        const path = [
            { x: 150, y: 250 }, { x: 450, y: 250 }, 
            { x: 450, y: 50 }, { x: 50, y: 50 },
            { x: 50, y: 250 }, {x: 150, y: 250}
        ];
        const pathLength = 300 + 200 + 400 + 200 + 100; // 1200

        function updateSimulationState() {
            const voltage = parseFloat(voltageSlider.value);
            const resistance = parseFloat(resistanceSlider.value);
            const current = (resistance > 0) ? voltage / resistance : 0;

            voltageValueSpan.textContent = voltage.toFixed(1);
            resistanceValueSpan.textContent = resistance.toFixed(0);
            currentValueSpan.textContent = current.toFixed(4);
            
            return { voltage, resistance, current };
        }
        
        function simulationLoop() {
            const { voltage, resistance, current } = updateSimulationState();
            
            const speed = Math.max(0.2, Math.min(20, current * 200));
            const numElectrons = Math.max(5, Math.min(70, Math.floor(current * 700)));
            
            if (electrons.length !== numElectrons) {
                createElectrons(numElectrons);
            }
            
            updateElectrons(speed);
            drawScene(voltage, resistance);
            
            requestAnimationFrame(simulationLoop);
        }

        function createElectrons(count) {
            electrons = [];
            for (let i = 0; i < count; i++) {
                electrons.push({ dist: (pathLength / count) * i });
            }
        }
        
        function updateElectrons(speed) {
            electrons.forEach(e => {
                e.dist = (e.dist + speed) % pathLength;
            });
        }

        function drawScene(voltage, resistance) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawWires();
            drawBattery(voltage);
            drawResistor(resistance);
            drawElectrons();
        }

        function drawWires() {
            ctx.strokeStyle = '#505f79';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();
        }

        function drawBattery(voltage) {
            const x = 100, y = 50;
            ctx.lineWidth = 4;
            // Negative terminal
            ctx.beginPath();
            ctx.moveTo(x - 20, y);
            ctx.lineTo(x + 20, y);
            ctx.strokeStyle = '#42526e';
            ctx.stroke();
            
            // Positive terminal
            ctx.beginPath();
            ctx.moveTo(x, y - 15);
            ctx.lineTo(x, y + 15);
            ctx.stroke();
            
            ctx.font = 'bold 18px Arial';
            ctx.fillStyle = var(--text-color);
            ctx.textAlign = 'center';
            ctx.fillText(`${voltage.toFixed(1)}V`, x, y - 30);
        }

        function drawResistor(resistance) {
            const x = 300, y = 250;
            ctx.strokeStyle = '#42526e';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(x - 50, y);
            for (let i = 0; i < 7; i++) {
                ctx.lineTo(x - 50 + (i * 15) + 7.5, y + (i % 2 === 0 ? -12 : 12));
            }
            ctx.lineTo(x + 60, y);
            ctx.stroke();
            
            ctx.font = 'bold 18px Arial';
            ctx.fillStyle = var(--text-color);
            ctx.fillText(`${resistance.toFixed(0)}Ω`, x + 5, y + 35);
        }
        
        function drawElectrons() {
            electrons.forEach(e => {
                const pos = getPositionOnPath(e.dist);
                
                // Skip drawing inside components
                if ((pos.y === 50 && pos.x > 75 && pos.x < 125) || (pos.y === 250 && pos.x > 245 && pos.x < 365)) {
                    return;
                }
                
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 5, 0, 2 * Math.PI);
                ctx.fillStyle = var(--electron-color);
                ctx.shadowColor = 'rgba(255, 171, 0, 0.7)';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowColor = 'transparent'; // Reset shadow
            });
        }
        
        function getPositionOnPath(d) {
            if (d < 300) return { x: 150 + d, y: 250 };
            d -= 300;
            if (d < 200) return { x: 450, y: 250 - d };
            d -= 200;
            if (d < 400) return { x: 450 - d, y: 50 };
            d -= 400;
            if (d < 200) return { x: 50, y: 50 + d };
            d -= 200;
            return { x: 50 + d, y: 250 };
        }

        voltageSlider.addEventListener('input', updateSimulationState);
        resistanceSlider.addEventListener('input', updateSimulationState);

        simulationLoop();
    });
</script>

</body>
</html>
