<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohm's Law Simulation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .simulation-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 800px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .controls {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        input[type="range"] {
            width: 250px;
        }
        #circuit-diagram {
            background-color: #e9e9e9;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .equation {
            text-align: center;
            font-size: 2em;
            margin-top: 20px;
            font-family: "Times New Roman", Times, serif;
        }
    </style>
</head>
<body>

<div class="simulation-container">
    <h1>Ohm's Law Interactive Simulation</h1>
    
    <div class="controls">
        <div class="control-group">
            <label for="voltage-slider">Voltage (V) = <span id="voltage-value">9.0</span> V</label>
            <input type="range" id="voltage-slider" min="0.1" max="20" value="9.0" step="0.1">
        </div>
        <div class="control-group">
            <label for="resistance-slider">Resistance (R) = <span id="resistance-value">500</span> Ω</label>
            <input type="range" id="resistance-slider" min="1" max="1000" value="500" step="1">
        </div>
    </div>

    <canvas id="circuit-diagram" width="760" height="200"></canvas>

    <div class="equation">
        I = V / R = <span id="current-value">0.018</span> A
    </div>
</div>

<script>
    const voltageSlider = document.getElementById('voltage-slider');
    const resistanceSlider = document.getElementById('resistance-slider');
    const voltageValueSpan = document.getElementById('voltage-value');
    const resistanceValueSpan = document.getElementById('resistance-value');
    const currentValueSpan = document.getElementById('current-value');
    const canvas = document.getElementById('circuit-diagram');
    const ctx = canvas.getContext('2d');

    function calculateAndUpdate() {
        const voltage = parseFloat(voltageSlider.value);
        const resistance = parseFloat(resistanceSlider.value);
        
        let current = 0;
        if (resistance > 0) {
            current = voltage / resistance;
        }

        voltageValueSpan.textContent = voltage.toFixed(1);
        resistanceValueSpan.textContent = resistance.toFixed(0);
        currentValueSpan.textContent = current.toFixed(4);

        drawCircuit(voltage, resistance, current);
    }

    function drawCircuit(voltage, resistance, current) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Wires
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(50, 100);
        ctx.lineTo(150, 100);
        ctx.moveTo(250, 100);
        ctx.lineTo(450, 100);
        ctx.moveTo(550, 100);
        ctx.lineTo(650, 100);
        ctx.lineTo(650, 50);
        ctx.lineTo(100, 50);
        ctx.lineTo(100, 100);
        ctx.stroke();

        // Battery (Voltage Source)
        ctx.beginPath();
        ctx.moveTo(150, 80);
        ctx.lineTo(150, 120);
        ctx.moveTo(165, 90);
        ctx.lineTo(165, 110);
        ctx.moveTo(180, 80);
        ctx.lineTo(180, 120);
        ctx.moveTo(195, 90);
        ctx.lineTo(195, 110);
        ctx.moveTo(210, 80);
        ctx.lineTo(210, 120);
        ctx.stroke();
        ctx.font = '16px Arial';
        ctx.fillStyle = 'black';
        ctx.textAlign = 'center';
        ctx.fillText(`${voltage.toFixed(1)} V`, 200, 70);

        // Resistor
        ctx.beginPath();
        ctx.moveTo(450, 100);
        const R_segments = 8;
        for (let i = 0; i < R_segments; i++) {
            ctx.lineTo(450 + (i * 100 / R_segments) + (100/(R_segments*2)), 100 + (i % 2 === 0 ? -15 : 15));
        }
        ctx.lineTo(550, 100);
        ctx.stroke();
        ctx.fillText(`${resistance.toFixed(0)} Ω`, 500, 70);

        // Current Flow (animated electrons)
        const numElectrons = Math.max(5, Math.min(50, Math.floor(current * 500)));
        const pathLength = 1100; 
        const speed = Math.max(0.5, Math.min(10, current * 100));
        
        for (let i = 0; i < numElectrons; i++) {
            const distance = ((Date.now() / 10 * speed) + (pathLength / numElectrons) * i) % pathLength;
            let x, y;

            if (distance < 550) { // Top wire
                x = 650 - distance;
                y = 50;
            } else if (distance < 600) { // Left vertical wire
                x = 100;
                y = 50 + (distance - 550);
            } else if (distance < 1100) { // Bottom wire
                x = 100 + (distance - 600);
                y = 100;
            }
            
            if(x > 150 && x < 250 && y === 100) continue; // Skip battery
            if(x > 450 && x < 550 && y === 100) continue; // Skip resistor

            ctx.beginPath();
            ctx.arc(x, y, 3, 0, 2 * Math.PI);
            ctx.fillStyle = 'blue';
            ctx.fill();
        }
    }
    
    voltageSlider.addEventListener('input', calculateAndUpdate);
    resistanceSlider.addEventListener('input', calculateAndUpdate);
    
    // Initial calculation and draw
    calculateAndUpdate();
    
    function animate() {
        calculateAndUpdate();
        requestAnimationFrame(animate);
    }
    
    animate();

</script>

</body>
</html>
